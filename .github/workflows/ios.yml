# 🍎 Makes the ADROS iPhone app file for the App Store (on GitHub's Mac, so no Mac needed).
#   ADROS.ipa → App Store Connect / TestFlight
# How to run it: GitHub → Actions → "iPhone app" → "Run workflow".
# Signing needs 4 repository secrets from the Apple Developer account (see ios-app/README.md):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# Without them (for example on a pull request) it still builds, to check nothing is broken,
# but the file is not signed and can't go to the App Store.
name: iPhone app
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (a whole number, +1 for every upload: 1, 2, 3 …)"
        required: true
        default: "1"
      version_name:
        description: "Version people see (like 1.0.0)"
        required: true
        default: "1.0.0"
      upload:
        description: "Send to App Store Connect (TestFlight) after building"
        type: boolean
        default: false
  pull_request:
    paths: ["ios-app/**", ".github/workflows/ios.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '1' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode (Apple needs the iOS 26 SDK for uploads)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Make the Xcode project (from ios-app/capacitor.config.json)
        run: ios-app/make-project.sh
      - name: Build the .ipa
        working-directory: ios-app/ios/App
        run: |
          mkdir -p ../../out
          COMMON=(-project App.xcodeproj -scheme App -configuration Release
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive"
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            TARGETED_DEVICE_FAMILY=1)
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::No Apple secrets yet, so this .ipa is NOT signed (only a build check)."
            xcodebuild archive "${COMMON[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/ios-app/out/ADROS-unsigned.ipa" Payload)
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive "${COMMON[@]}" "${AUTH[@]}" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          cp "$RUNNER_TEMP"/export/*.ipa ../../out/ADROS.ipa
      - name: Keep the file (download it from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: ADROS-iphone-v${{ env.VERSION_NAME }}-build${{ env.BUILD_NUMBER }}
          path: ios-app/out/
      - name: Send to App Store Connect (TestFlight)
        if: inputs.upload && env.ASC_KEY_P8 != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f ios-app/out/ADROS.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
